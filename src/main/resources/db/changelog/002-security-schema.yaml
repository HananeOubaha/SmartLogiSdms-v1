databaseChangeLog:
  # ===============================================
  # 002. INFRASTRUCTURE DE SÉCURITÉ (USERS & ROLES)
  # ===============================================

  # 002-1: Table ROLES
  - changeSet:
      id: 002-1
      author: smartlogi_team
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints: { nullable: false, unique: true }

  # 002-2: Table USERS
  - changeSet:
      id: 002-2
      author: smartlogi_team
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints: { nullable: false, unique: true }
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints: { nullable: false }

  # 002-3: Table de jonction USER_ROLES
  - changeSet:
      id: 002-3
      author: smartlogi_team
      changes:
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: role_id
                  type: BIGINT
                  constraints: { nullable: false }
        - addPrimaryKey:
            tableName: user_roles
            columnNames: user_id, role_id
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_roles_user
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_user_roles_role

  # 002-4: Insertion des rôles par défaut et d'un admin de test
  - changeSet:
      id: 002-4
      author: smartlogi_team
      changes:
        - insert:
            tableName: roles
            columns:
              - column: { name: name, value: "ROLE_MANAGER" }
        - insert:
            tableName: roles
            columns:
              - column: { name: name, value: "ROLE_DELIVERYMAN" }
        - insert:
            tableName: roles
            columns:
              - column: { name: name, value: "ROLE_CLIENT" }
        # Mot de passe '123456' haché en BCrypt
        - insert:
            tableName: users
            columns:
              - column: { name: username, value: "admin" }
              - column: { name: password, value: "$2a$10$8.UnVuG9HHgffUDAlk8qfOuVGkqRzgVymGe07xdqD1RPHu55S1EeG" }
        - insert:
            tableName: user_roles
            columns:
              - column: { name: user_id, valueNumeric: 1 }
              - column: { name: role_id, valueNumeric: 1 }